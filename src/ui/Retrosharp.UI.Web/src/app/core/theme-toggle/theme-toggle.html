<button
  mat-icon-button
  [matMenuTriggerFor]="menu"
  [attr.aria-label]="'Theme: ' + mode()"
  [title]="'Theme: ' + mode()"
>
  <mat-icon [fontIcon]="currentIcon()"></mat-icon>
</button>

<mat-menu #menu="matMenu">
  @for (option of options; track option.mode) {
    <button mat-menu-item (click)="select(option.mode)" [attr.aria-current]="option.mode === mode() ? 'true' : null">
      <mat-icon [fontIcon]="option.icon"></mat-icon>
      <span class="theme-toggle-label">
        {{ option.label }}
        @if (option.mode === mode()) {
          <mat-icon fontIcon="check" class="theme-toggle-check" aria-hidden="false" aria-label="Currently selected"></mat-icon>
        }
      </span>
    </button>
  }
</mat-menu>
