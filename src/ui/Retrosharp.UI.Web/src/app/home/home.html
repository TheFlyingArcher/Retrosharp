<div class="container">
  <div class="row gx-2 mt-3">
    <div class="col">
      <div class="mat-border-subtle mat-shadow-1 mat-corner-sm window">
        <div class="window-title"><mat-icon aria-hidden="false" aria-label="Birthday cake" fontIcon="cake"></mat-icon>Born on this day</div>
        <div class="window-content mock-table-host">
          <table mat-table [dataSource]="dataSource">
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef>Name</th>
              <td mat-cell *matCellDef="let row">{{ row.name }}</td>
            </ng-container>

            <ng-container matColumnDef="age">
              <th mat-header-cell *matHeaderCellDef>Age(d)</th>
              <td mat-cell *matCellDef="let row">{{ formatAge(row) }}</td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          </table>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="mat-border-subtle mat-shadow-1 mat-corner-sm window">
        <div class="window-title">This Day in Baseball History</div>
        <div class="window-content">
          Blah
        </div>
      </div>
    </div>
    <div class="col">

    </div>
  </div>
</div>
