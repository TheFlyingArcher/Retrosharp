name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION: src/Retrosharp.slnx

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} --configuration Release --no-build

  # Runs only for pushes that land on main. Computes the next semantic version,
  # builds+publishes each deployable's image to GHCR tagged with that version,
  # tags the commit, and opens a draft release. Publishing the release (a
  # separate, deliberate action) is what actually triggers CD -- see cd.yml.
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the version tag, create the draft release
      packages: write   # push images to GHCR
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full tag history to compute the next patch

      - name: Compute next version
        id: version
        run: |
          MAJOR="${{ vars.MAJOR }}"
          MINOR="${{ vars.MINOR }}"
          if [ -z "$MAJOR" ] || [ -z "$MINOR" ]; then
            echo "::error::Repo variables MAJOR and MINOR are not set (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

          LAST_PATCH=$(git tag -l "v${MAJOR}.${MINOR}.*" | sed -E "s/^v${MAJOR}\.${MINOR}\.//" | sort -n | tail -1)
          if [ -z "$LAST_PATCH" ]; then
            NEXT_PATCH=0
          else
            NEXT_PATCH=$((LAST_PATCH + 1))
          fi

          VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION"

      - name: Lowercase image owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push retrosharp-migration
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/lib/Retrosharp.Data.Migration/Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ghcr.io/${{ steps.owner.outputs.name }}/retrosharp-migration:${{ steps.version.outputs.version }}

      - name: Build & push retrosharp-engine-console
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/engine/Retrosharp.Engine.Console/Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ghcr.io/${{ steps.owner.outputs.name }}/retrosharp-engine-console:${{ steps.version.outputs.version }}

      - name: Build & push retrosharp-ui-api
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/ui/Retrosharp.UI.Api/Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ghcr.io/${{ steps.owner.outputs.name }}/retrosharp-ui-api:${{ steps.version.outputs.version }}

      - name: Tag commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Open draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: true
          generate_release_notes: true
