# Pi-sizing overlay (docker-compose.pi.yml mounts this at
# /etc/rabbitmq/conf.d/10-pi.conf). Blocks publishers at ~500 MiB -- before the
# 768M container memory limit -- so the broker applies backpressure instead of
# being OOM-killed. Set here rather than via RABBITMQ_VM_MEMORY_HIGH_WATERMARK,
# which the RabbitMQ 3.13 image rejects as a deprecated environment variable.
vm_memory_high_watermark.absolute = 500MB
