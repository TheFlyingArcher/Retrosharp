services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  retrosharp-migration:
    build:
      context: .
      dockerfile: src/lib/Retrosharp.Data.Migration/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: "no"

  retrosharp-engine-console:
    build:
      context: ./src
      dockerfile: engine/Retrosharp.Engine.Console/Dockerfile
    restart: unless-stopped
    env_file: .env
    # No host mount for source files: the ETL sagas download the Retrosheet game-log,
    # event, and biofile archives themselves, given only a season year, into a per-run
    # working directory (cleaned up after the run). This container therefore needs
    # outbound HTTPS to www.retrosheet.org -- point RetrosheetSource__BaseUrl at an
    # internal mirror if egress is restricted. See spec/retrosheet-auto-download.md
    # and docs/deployment.md.
    #
    # The working directory is a named volume, not the container's local temp dir --
    # required for BulkGameEventImportSaga to run safely under
    # `--scale retrosharp-engine-console=N`: the saga instance that downloads and
    # extracts an archive is not necessarily the replica NServiceBus later delivers
    # each file's GameEventStart to (they're competing consumers on one shared
    # queue), so every replica needs to see the same extracted files. Confirmed live
    # (spec/stress-testing.md Step 6): with a per-container temp dir, 2 replicas
    # completed only the files that happened to land back on the extracting replica
    # (5 of 30) and FileNotFoundException'd the rest. Harmless overhead at the
    # documented single-replica deployment.
    environment:
      RetrosheetSource__WorkingRoot: /data/retrosheet-import
    volumes:
      - retrosheet-import-data:/data/retrosheet-import
    depends_on:
      retrosharp-migration:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  retrosharp-ui-api:
    build:
      context: ./src
      dockerfile: ui/Retrosharp.UI.Api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "5197:8080"
    depends_on:
      retrosharp-migration:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
  retrosheet-import-data:
