services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  retrosharp-migration:
    build:
      context: .
      dockerfile: src/lib/Retrosharp.Data.Migration/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: "no"

  retrosharp-engine-console:
    build:
      context: ./src
      dockerfile: engine/Retrosharp.Engine.Console/Dockerfile
    restart: unless-stopped
    env_file: .env
    # Retrosheet source files the ETL endpoints reference by path -- biofiles, game
    # logs, and (for bulk import) a season's event-file zip. Drop them into
    # ./data/retrosheet/ on the host, then pass container paths like
    # /data/retrosheet/2024eve.zip to POST /api/gameevent/bulkimport. The bulk
    # import saga also extracts into (and cleans up) an _bulk-import/ subfolder here.
    # See spec/bulk-import.md and docs/deployment.md.
    volumes:
      - ./data/retrosheet:/data/retrosheet
    depends_on:
      retrosharp-migration:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  retrosharp-ui-api:
    build:
      context: ./src
      dockerfile: ui/Retrosharp.UI.Api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "5197:8080"
    depends_on:
      retrosharp-migration:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
